# Flatpak manifest (local builds). PyTorch wheels are fetched with pip during the
# build, which needs network access:
#   flatpak-builder --user --install --force-clean \
#       --build-args=--share=network build/flatpak \
#       packaging/flatpak/io.github.pixelift.Pixelift.yml
# The wheels are pinned by hash (packaging/requirements-cp312.txt). For Flathub,
# replace the pip step with generated sources (flatpak-pip-generator).
id: io.github.pixelift.Pixelift
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: pixelift
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri          # GPU access (CUDA/ROCm need the matching driver extensions)
  - --share=network       # only used to download AI models on request
  # Read photos and write results next to them, in the folders photos live in.
  # Not all of $HOME: no access to dotfiles, shell start-up files or keys.
  # Files elsewhere can still be opened through the file chooser portal;
  # to also write results next to them: flatpak override --user --filesystem=home
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
modules:
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args: [--share=network]
    build-commands:
      - pip3 install --prefix=/app --no-cache-dir --require-hashes --only-binary=:all:
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple -r requirements-cp312.txt
    sources:
      - type: file
        path: ../requirements-cp312.txt
  - name: pixelift
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 packaging/io.github.pixelift.Pixelift.desktop
          /app/share/applications/io.github.pixelift.Pixelift.desktop
      - install -Dm644 pixelift/data/icons/hicolor/scalable/apps/io.github.pixelift.Pixelift.svg
          /app/share/icons/hicolor/scalable/apps/io.github.pixelift.Pixelift.svg
      - install -Dm644 packaging/io.github.pixelift.Pixelift.metainfo.xml
          /app/share/metainfo/io.github.pixelift.Pixelift.metainfo.xml
    sources:
      - type: dir
        path: ../..
